# Akku (ME/CFS pacing app in pacing/): analyze and test. Runs only when the
# pacing app changes, so the main app's CI is untouched.
name: pacing

on:
  push:
    paths: ['pacing/**', '.github/workflows/pacing.yml']
  pull_request:
    paths: ['pacing/**', '.github/workflows/pacing.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacing
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
