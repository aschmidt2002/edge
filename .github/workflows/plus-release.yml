# Edge+ (personal fork): keep `meine-features` up to date with the original
# app's official releases and publish a signed APK for Obtainium.
#
# Runs daily and on demand (Actions tab > plus-release > Run workflow).
#   1. Merge the newest published upstream release tag into `meine-features`.
#      A merge conflict stops the run with an error; resolve it locally.
#   2. If the branch has a commit that has no Edge+ release yet, build a signed
#      APK and publish it as a GitHub Release (tag like `0.12.3-plus.17`).
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   required, your own release key
#   SYNC_TOKEN   optional but recommended: a fine-grained token with
#                "Contents" and "Workflows" write access to this repo. Without
#                it, a push fails whenever upstream changed a workflow file.

name: plus-release

on:
  schedule:
    - cron: '23 3 * * *'   # daily, 03:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build a release even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: plus-release
  cancel-in-progress: false

env:
  BRANCH: meine-features
  UPSTREAM_REPO: OpenStrap/edge

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the latest official upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          echo "Latest upstream release: $tag"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"

          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Already contains $tag."
            exit 0
          fi
          if ! git merge --no-edit -m "Merge upstream release $tag into $BRANCH" "$tag"; then
            echo "::error::Merge conflict with upstream $tag in: $(git diff --name-only --diff-filter=U | tr '\n' ' '). Merge it locally (git fetch upstream --tags && git merge $tag), fix the conflict, push, then run this workflow again."
            git merge --abort
            exit 1
          fi
          git push origin "HEAD:$BRANCH"

      - name: Decide whether to release
        id: check
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD -l '*-plus.*')" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "This commit is already released. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name=${ver%%+*}
          build=${ver#*+}
          # Always grows: upstream build number first, then this workflow's run number.
          code=$(( build * 10000 + GITHUB_RUN_NUMBER % 10000 ))
          vname="$name-plus.$GITHUB_RUN_NUMBER"
          flutter_version=$(grep -m1 -E "flutter-version:" .github/workflows/build.yml | sed -E "s/.*flutter-version:[[:space:]]*'?([0-9.]+)'?.*/\1/")
          {
            echo "release=true"
            echo "code=$code"
            echo "vname=$vname"
            echo "flutter=$flutter_version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $vname (versionCode $code) with Flutter $flutter_version"

      - name: Check signing secrets
        if: steps.check.outputs.release == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without these Gradle silently falls back to debug signing, and that
          # APK could never update an installed Edge+.
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then
              echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              exit 1
            fi
          done
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.release == 'true'
        with:
          flutter-version: ${{ steps.check.outputs.flutter }}

      - name: Build signed APK
        if: steps.check.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # No companion/backend servers in this fork: the app runs fully local.
          printf 'COMPANION_URL=\nBACKEND_URL=\n' > .env
          flutter pub get
          flutter build apk --release \
            --build-number=${{ steps.check.outputs.code }} \
            --build-name=${{ steps.check.outputs.vname }} \
            --dart-define-from-file=.env
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/edge-plus-${{ steps.check.outputs.vname }}.apk"

      - name: Publish release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.check.outputs.vname }}
          name: Edge+ ${{ steps.check.outputs.vname }}
          target_commitish: ${{ steps.check.outputs.sha }}
          body: |
            Edge+ build from `${{ env.BRANCH }}` at commit ${{ steps.check.outputs.sha }}.
          files: dist/edge-plus-${{ steps.check.outputs.vname }}.apk
