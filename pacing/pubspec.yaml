name: akku
description: "Akku – Energie-Pacing für ME/CFS und Long COVID. Arbeitstitel."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # 1.x like edge: BSD-3. 2.x moved to a licence with a commercial clause and a build-time telemetry ping.
  flutter_blue_plus: ^1.36.8
  flutter_local_notifications: ^22.3.3
  health: ^13.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
